name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore tools and packages
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore .\TheIsleOverlay.sln

      - name: Package installer and updates
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\Package-Release.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" .\artifacts\distribution\* `
            --title "Isle Live Map ${{ github.ref_name }}" `
            --notes-file .\RELEASE_NOTES.md
